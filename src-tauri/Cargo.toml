[package]
name = "termlume"
version = "0.1.0"
edition = "2021"
description = "Termlume SSH workspace"

[lib]
name = "termlume"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time", "process"] }
zeroize = "1"
rand = "0.10"
regex = "1"
tempfile = "3"
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17"

[profile.release]
lto = "thin"
strip = true
