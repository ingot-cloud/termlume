<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Termlume</title>
  <link rel="stylesheet" href="/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/xterm.js"></script>
  <script defer src="/fit.js"></script>
  <script defer src="/search.js"></script>
  <script defer src="/dropdown.js"></script>
  <script defer src="/renderer.js"></script>
</head>
<body>
  <header class="titlebar">
    <span class="brand" title="Termlume"><span class="mark" aria-hidden="true">›_</span><span class="brand-name">Termlume</span></span>
    <div class="tabbar">
      <nav id="tabs" aria-label="会话标签"></nav>
      <button id="add-tab" type="button" aria-haspopup="dialog" aria-label="新建 SSH 标签" title="新建 SSH 标签">
        <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <button id="palette-button" class="launcher" aria-label="查找主机或命令" title="查找主机或命令 (⌘K)">
      <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
      <span>查找主机或命令</span><kbd>⌘ K</kbd>
    </button>
  </header>
  <div id="workspace" data-view="hosts" data-host-layout="cards">
    <aside id="sidebar" aria-label="侧栏">
      <div class="sidebar-header">
        <span class="sidebar-label">工作台</span>
        <button id="toggle-nav" type="button" aria-controls="workspace-nav" aria-expanded="true" aria-label="收起导航" title="收起导航">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>
      <nav id="workspace-nav" aria-label="功能菜单">
        <button type="button" data-page="hosts" aria-controls="hosts" aria-current="page" aria-label="主机" title="主机">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01m4-9h5m-5 9h5"/></svg>
          <span class="sidebar-label">主机</span>
        </button>
        <button type="button" data-page="keys" aria-controls="keys-page" aria-label="SSH 密钥" title="SSH 密钥">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 13.5a5 5 0 1 0-5-5 5 5 0 0 0 .5 2.2L4 17.7V21h3.3l1.5-1.5V17h2.5l2.5-2.5m3.6-7.2h.01"/></svg>
          <span class="sidebar-label">SSH 密钥</span>
        </button>
        <button type="button" data-page="vault" aria-controls="vault-page" aria-label="保险库" title="保险库">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5zM12 14v3"/></svg>
          <span class="sidebar-label">保险库</span>
        </button>
      </nav>
    </aside>
    <main id="workspace-content">
      <section id="hosts" aria-label="主机列表">
        <header class="section-head">
          <div><h1>主机</h1><p class="host-total"><span id="host-count">0</span> 台已保存</p></div>
          <div class="host-header-actions"><button id="import-hosts">导入 OpenSSH…</button><button id="add-host" class="primary">＋ 新建主机</button></div>
        </header>
        <div class="host-filters">
          <input id="host-search" type="search" placeholder="搜索主机或分组" aria-label="搜索主机和分组">
          <select id="tag-filter" aria-label="筛选标签"></select>
          <button id="remove-group" hidden>移除分组</button>
          <select id="host-layout" aria-label="主机视图">
            <option value="cards" data-icon="▦">卡片</option><option value="rows" data-icon="☷">列表</option>
          </select>
        </div>
        <nav id="host-breadcrumb" aria-label="主机分组路径" hidden>
          <button id="all-hosts">全部主机</button><span aria-hidden="true">›</span><span id="current-group" aria-current="location"></span>
        </nav>
        <div id="host-list"></div>
      </section>
      <section id="work" aria-label="当前会话" hidden>
        <header id="toolbar" hidden>
          <div id="context"></div>
          <div id="session-actions"></div>
        </header>
        <div id="content">
          <section id="terminal-stage" aria-label="终端工作区">
            <div id="terminal-views"></div>
            <div id="session-notice" hidden></div>
            <form id="terminal-find" hidden>
              <input type="search" aria-label="查找终端输出" placeholder="查找终端输出">
              <button type="submit" aria-label="下一个结果">↓</button>
              <button type="button" id="close-find" aria-label="关闭查找">×</button>
            </form>
          </section>
          <aside id="files" aria-label="远端文件" hidden></aside>
        </div>
      </section>
      <section id="keys-page" class="settings-page" aria-label="SSH 密钥" hidden></section>
      <section id="vault-page" class="settings-page" aria-label="保险库" hidden></section>
    </main>
  </div>
  <section id="queue" aria-label="传输任务" hidden></section>
  <footer class="footer">
    <span id="status" role="status" aria-live="polite">就绪</span>
    <button id="queue-button" aria-expanded="false">⇄ 传输</button>
  </footer>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="key-dialog" aria-labelledby="key-dialog-title"></dialog>
  <section id="vault-lock" hidden>
    <form id="unlock-form">
      <span class="settings-icon" aria-hidden="true">◇</span>
      <h1>保险库已锁定</h1>
      <p class="muted">使用主密码或恢复密钥重新访问工作台。</p>
      <label>解锁方式<select id="unlock-mode" aria-label="解锁方式"><option value="password">主密码</option><option value="recovery">恢复密钥</option></select></label>
      <label>解锁凭据<input id="unlock-secret" type="password" required autocomplete="off"></label>
      <p id="unlock-error" class="danger" role="alert"></p>
      <button type="submit" class="primary">解锁</button>
    </form>
  </section>
</body>
</html>
