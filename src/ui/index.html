<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Termlume</title>
  <link rel="stylesheet" href="/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/xterm.js"></script>
  <script defer src="/fit.js"></script>
  <script defer src="/search.js"></script>
  <script defer src="/dropdown.js"></script>
  <script defer src="/overlays.js"></script>
  <script defer src="/terminal-paths.js"></script>
  <script defer src="/workspace-state.js"></script>
  <script defer src="/renderer.js"></script>
</head>
<body>
  <header class="titlebar">
    <button id="library-button" class="brand" type="button" aria-controls="hosts" aria-label="打开主机工作台" title="打开主机工作台">
      <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-11 0v11"/></svg>
      <span>工作台</span>
    </button>
    <div class="tabbar">
      <nav id="tabs" aria-label="会话标签"></nav>
      <button id="add-tab" type="button" aria-label="新建标签" title="新建标签">
        <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="switch-tabs" type="button" aria-haspopup="dialog" aria-controls="session-switcher" aria-expanded="false" aria-label="切换会话" title="切换会话 (⌘J)" hidden>⋯</button>
    </div>
    <button id="palette-button" class="launcher" aria-label="查找主机、会话或命令" title="查找主机、会话或命令 (⌘K)">
      <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
      <span>查找主机、会话或命令</span><kbd>⌘ K</kbd>
    </button>
  </header>
  <div id="workspace" data-view="hosts" data-host-layout="cards">
    <aside id="sidebar" aria-label="侧栏">
      <div class="sidebar-header">
        <span class="sidebar-label">工作台</span>
        <button id="toggle-nav" type="button" aria-controls="workspace-nav" aria-expanded="true" aria-label="收起导航" title="收起导航">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>
      <nav id="workspace-nav" aria-label="功能菜单">
        <button type="button" data-page="hosts" aria-controls="hosts" aria-current="page" aria-label="主机" title="主机">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01m4-9h5m-5 9h5"/></svg>
          <span class="sidebar-label">主机</span>
        </button>
        <button type="button" data-page="keys" aria-controls="keys-page" aria-label="SSH 密钥" title="SSH 密钥">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 13.5a5 5 0 1 0-5-5 5 5 0 0 0 .5 2.2L4 17.7V21h3.3l1.5-1.5V17h2.5l2.5-2.5m3.6-7.2h.01"/></svg>
          <span class="sidebar-label">SSH 密钥</span>
        </button>
        <button type="button" data-page="transfers" aria-controls="transfers-page" aria-label="传输记录" title="传输记录">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20V4m-4 4 4-4 4 4m6-4v16m-4-4 4 4 4-4"/></svg>
          <span class="sidebar-label">传输记录</span>
        </button>
        <button type="button" data-page="settings" aria-controls="settings-page" aria-label="设置" title="设置">
          <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></svg>
          <span class="sidebar-label">设置</span>
        </button>
      </nav>
      <nav id="workspace-tools" aria-label="设置分类" hidden></nav>
    </aside>
    <main id="workspace-content">
      <section id="hosts" aria-label="主机列表">
        <header class="page-toolbar host-toolbar">
          <form id="host-search-form" class="tab-search">
            <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
            <input id="host-search" type="search" placeholder="搜索主机，或输入 user@host" aria-label="搜索主机和分组" autocomplete="off">
            <button id="host-connect" type="submit" class="toolbar-button" disabled>连接</button>
          </form>
          <div class="toolbar-row">
            <div class="toolbar-actions">
              <button id="add-host" type="button" class="primary">＋ 新建主机</button>
              <button id="import-hosts" type="button" class="toolbar-button">导入 OpenSSH</button>
            </div>
            <div class="toolbar-actions host-filters">
              <button id="remove-group" type="button" hidden>移除分组</button>
              <select id="tag-filter" aria-label="筛选标签"></select>
              <select id="host-layout" aria-label="主机视图">
                <option value="cards" data-icon="▦">卡片</option><option value="rows" data-icon="☷">列表</option>
              </select>
            </div>
          </div>
        </header>
        <div id="host-library" class="page-body">
          <nav id="host-breadcrumb" aria-label="主机分组路径" hidden>
            <button id="all-hosts" type="button">全部主机</button><span aria-hidden="true">›</span><span id="current-group" class="text-ellipsis" aria-current="location"></span>
          </nav>
          <div id="host-list"></div>
        </div>
      </section>
      <section id="new-tab-page" aria-label="新建标签" hidden>
        <div class="quick-connect">
          <div class="quick-connect-tools">
            <form id="quick-connect-form" class="tab-search">
              <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
              <input id="quick-connect-search" type="search" placeholder="搜索主机、标签，或输入 user@host" aria-label="搜索主机或标签" autocomplete="off">
              <kbd>⌘ K</kbd>
            </form>
            <button id="quick-add-host" type="button" class="outlined">新建主机</button>
          </div>
          <div id="quick-connect-filters"></div>
          <div id="quick-connect-results"></div>
        </div>
      </section>
      <section id="work" aria-label="当前会话" hidden>
        <header id="toolbar" hidden>
          <div id="context"></div>
          <div id="toolbar-actions">
            <button id="save-layout" type="button" class="outlined" aria-label="保存工作区布局" aria-haspopup="dialog" hidden>
              <svg class="chrome-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2zm2 0v7h10V3M7 21v-7h10v7"/></svg>
              <span>保存布局</span>
            </button>
            <div id="session-actions"></div>
          </div>
        </header>
        <div id="content">
          <section id="terminal-stage" aria-label="终端工作区">
            <div id="terminal-views"></div>
            <div id="session-notice" hidden></div>
            <div id="terminal-drop" aria-hidden="true" hidden></div>
            <button id="terminal-bottom" type="button" class="outlined" hidden>↓ 回到底部</button>
            <form id="terminal-find" hidden>
              <input type="search" aria-label="查找终端输出" placeholder="查找终端输出">
              <button type="submit" aria-label="下一个结果">↓</button>
              <button type="button" id="close-find" aria-label="关闭查找">×</button>
            </form>
          </section>
          <aside id="files" aria-label="远端文件" inert></aside>
        </div>
      </section>
      <section id="keys-page" class="settings-page" aria-label="SSH 密钥" hidden></section>
      <section id="transfers-page" class="settings-page" aria-label="传输记录" hidden>
        <header class="page-toolbar transfer-toolbar">
          <div class="toolbar-actions">
            <div id="transfer-filters" role="group" aria-label="筛选传输类型">
              <button type="button" data-direction="" aria-pressed="true">全部</button>
              <button type="button" data-direction="down" aria-pressed="false">下载</button>
              <button type="button" data-direction="up" aria-pressed="false">上传</button>
            </div>
            <button id="clear-downloads" type="button" class="toolbar-button" disabled>清空下载记录</button>
          </div>
        </header>
        <div class="page-body">
          <p id="transfer-feedback" class="muted" role="status" hidden></p>
          <section class="transfer-group" aria-labelledby="transfer-active-title">
            <h2 id="transfer-active-title">进行中</h2>
            <div id="transfer-active"></div>
            <p id="transfer-active-empty" class="muted">暂无进行中的传输。</p>
          </section>
          <section class="transfer-group" aria-labelledby="transfer-history-title">
            <h2 id="transfer-history-title">历史记录</h2>
            <div id="transfer-history"></div>
            <p id="transfer-history-empty" class="muted" hidden>暂无传输记录。</p>
          </section>
        </div>
      </section>
      <section id="settings-page" class="settings-page" aria-label="设置" hidden></section>
    </main>
  </div>
  <footer class="footer">
    <span id="status" class="text-ellipsis" role="status" aria-live="polite">就绪</span>
    <button id="queue-button" type="button" aria-controls="transfers-page">⇄ 传输记录</button>
  </footer>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="file-editor" aria-labelledby="file-editor-title"></dialog>
  <dialog id="key-dialog" aria-labelledby="key-dialog-title"></dialog>
  <dialog id="session-switcher" aria-labelledby="session-switcher-title">
    <form id="session-switcher-form" class="tab-search">
      <span id="session-switcher-title">切换会话</span>
      <input id="session-switcher-search" type="search" placeholder="搜索会话、地址、分组或标签" aria-label="搜索会话、地址、分组或标签" autocomplete="off">
      <kbd>⌘ J</kbd>
      <button id="close-switcher" type="button" aria-label="关闭会话切换" title="关闭">×</button>
    </form>
    <div id="session-switcher-filters"></div>
    <div id="session-switcher-results"></div>
  </dialog>
  <section id="vault-lock" hidden>
    <form id="unlock-form">
      <span class="settings-icon" aria-hidden="true">◇</span>
      <h1>Termlume 已锁定</h1>
      <p class="muted">验证身份后重新访问工作台。</p>
      <label>解锁方式<select id="unlock-mode" aria-label="解锁方式"><option value="password">主密码</option><option value="recovery">恢复密钥</option></select></label>
      <label>解锁凭据<input id="unlock-secret" type="password" required autocomplete="off"></label>
      <p id="unlock-error" class="danger" role="alert"></p>
      <div class="settings-actions unlock-actions">
        <button id="unlock-touch-id" type="button" class="outlined" hidden>使用触控 ID</button>
        <button id="unlock-submit" type="submit" class="primary">解锁</button>
      </div>
    </form>
  </section>
</body>
</html>
